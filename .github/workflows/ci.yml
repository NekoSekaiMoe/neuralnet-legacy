# .github/workflows/ci.yml\nname: CI\n\non:\n  push:\n    branches: ["main"]\n  pull_request:\n    branches: ["main"]\n\njobs:\n  build-and-test:\n    strategy:\n      fail-fast: false\n      matrix:\n        os: [ubuntu-latest, windows-latest]\n        build_type: [Release, Debug]\n        compiler: [gcc]\n        include:\n          - os: ubuntu-latest\n            compiler: clang\n            build_type: Release\n          - os: ubuntu-latest\n            compiler: gcc\n            build_type: Debug\n            sanitizer: asan\n          - os: ubuntu-latest\n            compiler: gcc\n            build_type: Debug\n            sanitizer: ubsan\n\n    runs-on: ${{ matrix.os }}\n\n    env:\n      BUILD_TYPE: ${{ matrix.build_type }}\n\n    steps:\n      - uses: actions/checkout@v4\n\n      # ========== Linux: 安装依赖 ==========\n      - name: Install dependencies (Linux / GCC)\n        if: runner.os == 'Linux' && matrix.compiler == 'gcc'\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y g++ ninja-build libtbb-dev p7zip-full\n\n      - name: Install dependencies (Linux / Clang)\n        if: runner.os == 'Linux' && matrix.compiler == 'clang'\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y clang ninja-build libtbb-dev p7zip-full\n\n      # ========== Windows: 安装依赖 ==========\n      - name: Install dependencies (Windows)\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          choco install mingw --yes --no-progress\n          choco install ninja --yes --no-progress\n          choco install 7zip --yes --no-progress\n          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg\n          cd C:\vcpkg\n          .\bootstrap-vcpkg.bat\n          .\vcpkg install tbb:x64-mingw-dynamic\n          $vcpkgDir = "C:\vcpkg\installed\x64-mingw-dynamic"\n          echo "CMAKE_PREFIX_PATH=$vcpkgDir" >> $env:GITHUB_ENV\n          echo "TBB_DIR=$vcpkgDir\lib\cmake\TBB" >> $env:GITHUB_ENV\n\n      # ========== CMake 配置 (Linux / GCC) ==========\n      - name: Configure CMake (Linux / GCC)\n        if: runner.os == 'Linux' && matrix.compiler == 'gcc'\n        run: |\n          CMAKE_ARGS="-B ${{github.workspace}}/build -G Ninja"\n          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc"\n          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}"\n          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON"\n          if [ "${{ matrix.sanitizer }}" = "asan" ]; then\n            CMAKE_ARGS="$CMAKE_ARGS -DENABLE_ASAN=ON"\n          fi\n          if [ "${{ matrix.sanitizer }}" = "ubsan" ]; then\n            CMAKE_ARGS="$CMAKE_ARGS -DENABLE_UBSAN=ON"\n          fi\n          cmake $CMAKE_ARGS\n        env:\n          CC: gcc\n          CXX: g++\n\n      # ========== CMake 配置 (Linux / Clang) ==========\n      - name: Configure CMake (Linux / Clang)\n        if: runner.os == 'Linux' && matrix.compiler == 'clang'\n        run: |\n          cmake -B ${{github.workspace}}/build \\n            -G Ninja \\n            -DCMAKE_CXX_COMPILER=clang++ \\n            -DCMAKE_C_COMPILER=clang \\n            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \\n            -DCMAKE_CXX_STANDARD=17 \\n            -DCMAKE_CXX_STANDARD_REQUIRED=ON\n        env:\n          CC: clang\n          CXX: clang++\n\n      # ========== CMake 配置 (Windows) ==========\n      - name: Configure CMake (Windows)\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          cmake -B ${{github.workspace}}/build `\n            -G Ninja `\n            -DCMAKE_CXX_COMPILER=g++ `\n            -DCMAKE_C_COMPILER=gcc `\n            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `\n            -DCMAKE_CXX_STANDARD=17 `\n            -DCMAKE_CXX_STANDARD_REQUIRED=ON\n\n      # ========== 构建 ==========\n      - name: Build\n        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}\n\n      # ========== 测试 ==========\n      - name: Test\n        working-directory: ${{github.workspace}}/build\n        run: ctest --build-config ${{env.BUILD_TYPE}} --output-on-failure --timeout 120\n\n  # ── 打包与发布（仅 main 分支 push） ──────────────────────────────────────\n  package:\n    needs: build-and-test\n    if: github.event_name == 'push' && github.ref == 'refs/heads/main'\n    runs-on: ${{ matrix.os }}\n    strategy:\n      matrix:\n        os: [ubuntu-latest, windows-latest]\n        include:\n          - os: ubuntu-latest\n            artifact-name: linux-binaries\n            binary-suffix: ""\n            archive-name: neuralnet-linux-x64.7z\n          - os: windows-latest\n            artifact-name: windows-binaries\n            binary-suffix: ".exe"\n            archive-name: neuralnet-windows-x64.7z\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Install dependencies (Linux)\n        if: runner.os == 'Linux'\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y g++ ninja-build libtbb-dev p7zip-full\n\n      - name: Install dependencies (Windows)\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          choco install mingw --yes --no-progress\n          choco install ninja --yes --no-progress\n          choco install 7zip --yes --no-progress\n          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg\n          cd C:\vcpkg\n          .\bootstrap-vcpkg.bat\n          .\vcpkg install tbb:x64-mingw-dynamic\n          $vcpkgDir = "C:\vcpkg\installed\x64-mingw-dynamic"\n          echo "CMAKE_PREFIX_PATH=$vcpkgDir" >> $env:GITHUB_ENV\n          echo "TBB_DIR=$vcpkgDir\lib\cmake\TBB" >> $env:GITHUB_ENV\n\n      - name: Configure & Build (Linux)\n        if: runner.os == 'Linux'\n        run: |\n          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release\n          cmake --build build\n        env:\n          CC: gcc\n          CXX: g++\n\n      - name: Configure & Build (Windows)\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release\n          cmake --build build\n\n      - name: Package (Linux)\n        if: runner.os == 'Linux'\n        run: |\n          mkdir -p package/bin\n          cp build/src/mnist_train build/src/mnist_infer package/bin/\n          7z a ${{ matrix.archive-name }} ./package\n\n      - name: Package (Windows)\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force -Path package/bin\n          Copy-Item build/src/mnist_train.exe, build/src/mnist_infer.exe package/bin/\n          7z a ${{ matrix.archive-name }} ./package\n\n      - name: Upload artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: ${{ matrix.artifact-name }}\n          path: ${{ matrix.archive-name }}\n          retention-days: 1\n\n  release:\n    needs: package\n    if: github.event_name == 'push' && github.ref == 'refs/heads/main'\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n\n    steps:\n      - name: Download Linux artifacts\n        uses: actions/download-artifact@v4\n        with:\n          name: linux-binaries\n          path: artifacts/linux\n\n      - name: Download Windows artifacts\n        uses: actions/download-artifact@v4\n        with:\n          name: windows-binaries\n          path: artifacts/windows\n\n      - name: Create Release\n        uses: softprops/action-gh-release@v2\n        with:\n          name: Nightly Build - ${{ github.sha }}\n          tag_name: nightly\n          prerelease: true\n          body: |\n            自动构建版本，commit: ${{ github.sha }}\n\n            ### 构建环境\n            - Compiler: GCC / Clang\n            - C++ Standard: C++17\n            - CI Matrix: Release/Debug × GCC/Clang × Linux/Windows + ASan/UBSan\n\n            | 平台 | 产物 |\n            |------|------|\n            | 🐧 Linux (Ubuntu Latest) | `neuralnet-linux-x64.7z` |\n            | 🪟 Windows (Latest) | `neuralnet-windows-x64.7z` |\n          files: |\n            artifacts/**/*.7z\n